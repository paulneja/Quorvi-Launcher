name: Build Debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # GitHub OAuth App 的 client id（公开值，用于 device flow 登录）
  GITHUB_CLIENT_ID: Ov23liTho4F4jMunbtAl

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Kotlin jvmToolchain(21) + Gradle 9.x 需要 JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 关键：显式覆盖默认的 packages，避免 action 去装已被移除的旧包 "tools"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # API 37 (Android 17) 目前是预览版：sdkmanager 安装的目录叫 android-37.0，
      # 而 AGP 的 release(37) 会查找 android-37，因此做一次符号链接映射；
      # 预览包自带的 android.jar 不完整，替换为同 API 级别的 AOSP 编译产物。
      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

          PLATFORM_DIR="$ANDROID_HOME/platforms/android-37.0"
          SOURCE_PROPS="$PLATFORM_DIR/source.properties"

          # 把 ApiLevel 修正为 37，并清空 CodeName，让 AGP 按 release 版识别；重复执行无副作用
          if [ -f "$SOURCE_PROPS" ]; then
            sed -i -E 's/^AndroidVersion\.ApiLevel=.*/AndroidVersion.ApiLevel=37/' "$SOURCE_PROPS"
            sed -i -E 's/^AndroidVersion\.CodeName=.*/AndroidVersion.CodeName=/' "$SOURCE_PROPS"
          else
            printf 'AndroidVersion.ApiLevel=37\nAndroidVersion.CodeName=\n' > "$SOURCE_PROPS"
          fi

          ln -sfn "$PLATFORM_DIR" "$ANDROID_HOME/platforms/android-37"

          curl -fsSL -o "$PLATFORM_DIR/android.jar" \
            https://github.com/Reginer/aosp-android-jar/raw/refs/heads/main/android-37/android-jdk21.jar

      # 缓存 Gradle 分发包与依赖
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # build.gradle.kts 优先读 local.properties，其次读 GITHUB_CLIENT_ID 环境变量；
      # 这里两者都写好，避免任何情况下 client id 丢失。
      - name: Generate local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "github.clientId=$GITHUB_CLIENT_ID" >> local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quorvi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30